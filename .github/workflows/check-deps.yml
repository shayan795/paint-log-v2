# 外部ライブラリの更新チェック（保険）
#
# 主役は「テスト実行時に自動で表示される警告」（tests/run_front_tests.mjs → scripts/check_deps.mjs）。
# しばらく開発をしていない期間は、そもそもテストが走らないので誰も気づけない。
# そこを埋めるのがこのワークフロー。毎週勝手に確認して、新版が出ていたらIssueを立てる。
#
# ⚠️ GitHub Actions の cron は「リポジトリに60日間まったく動きが無い」と自動停止する。
#    停止しても通知は出ない。ただしこのリポジトリは頻繁に更新しているため、実質当たらない。
#    長期間放置したときは、Actionsタブから手動実行(workflow_dispatch)して活動を戻すこと。

name: ライブラリ更新チェック

on:
  schedule:
    - cron: "0 0 * * 1"      # 毎週月曜 09:00(日本時間)
  workflow_dispatch:          # 手動でも実行できるようにする

permissions:
  contents: read
  issues: write               # 新版があったときにIssueを立てるため

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 新しい版が出ていないか・見直し期限を過ぎていないか確認する
        id: check
        run: |
          set -euo pipefail
          # 版と固定日は vendor/pinned.json が正本。
          # ファイルの更新日時は使えない（git checkout で全部その時刻に書き換わるため）。
          CUR=$(node -e 'const j=require("./vendor/pinned.json");console.log(j.packages[0].version)')
          PINNED=$(node -e 'const j=require("./vendor/pinned.json");console.log(j.packages[0].pinnedAt)')
          EVERY=$(node -e 'const j=require("./vendor/pinned.json");console.log(j.policy.reviewEveryDays)')
          DAYS=$(node -e "console.log(Math.floor((Date.now()-Date.parse('$PINNED'+'T00:00:00Z'))/86400000))")
          LATEST=$(curl -sS --max-time 20 https://registry.npmjs.org/@supabase/supabase-js/latest \
                   | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          echo "使用中: $CUR / 最新: $LATEST / 固定から ${DAYS}日（${EVERY}日で見直し）"
          echo "current=$CUR"  >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS"     >> "$GITHUB_OUTPUT"
          # 「新版が出ている」か「見直し期限を過ぎた」のどちらかで知らせる
          if [ "$CUR" != "$LATEST" ] || [ "$DAYS" -ge "$EVERY" ]; then
            echo "outdated=true"  >> "$GITHUB_OUTPUT"
          else
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DAYS" -ge "$EVERY" ]; then echo "overdue=true" >> "$GITHUB_OUTPUT";
          else echo "overdue=false" >> "$GITHUB_OUTPUT"; fi

      - name: 新版があればIssueを立てる（既にあれば作らない）
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          DAYS: ${{ steps.check.outputs.days }}
          OVERDUE: ${{ steps.check.outputs.overdue }}
        run: |
          set -euo pipefail
          if [ "$OVERDUE" = "true" ]; then
            TITLE="【期限超過】Supabaseライブラリの更新: ${CUR} → ${LATEST}"
          else
            TITLE="Supabaseライブラリの更新: ${CUR} → ${LATEST}"
          fi
          # 同じ内容のIssueが既に開いていれば作らない（毎週増え続けるのを防ぐ）
          EXISTING=$(gh issue list --state open --search "in:title Supabaseライブラリの更新" --json title \
                     --jq "[.[] | select(.title==\"${TITLE}\")] | length")
          if [ "$EXISTING" != "0" ]; then
            echo "同じIssueが既にあります。何もしません。"
            exit 0
          fi
          gh issue create --title "$TITLE" --label "" --body "$(cat <<EOF
          Supabaseライブラリに新しい版が出ています。

          - 使用中: \`${CUR}\`
          - 最新:   \`${LATEST}\`
          - 固定してから **${DAYS}日**

          $( [ "$OVERDUE" = "true" ] && echo '**見直し期限(90日)を過ぎています。** 最新のままでも一度更新作業を通してください。' || echo '**急ぎではありません。** ただし放置するとセキュリティ修正も入りません。' )

          ## やること
          Claudeに「**Supabaseライブラリを更新して**」と言えば、
          ダウンロード・npm公式との一致確認・読み込み先の差し替え・全テストの実行までやります。

          自分でやる場合は README の「§4.5 ライブラリを更新する」を参照。
          EOF
          )"
