name = "paintlog-v2"
main = "src/worker.js"
compatibility_date = "2026-06-01"
# ★false にして workers.dev の入口を閉じる。
# true だと paintlog-v2.<アカウント>.workers.dev でも全く同じサイトが公開され、
# 独自ドメイン以外の入口が増える（検索に重複として拾われる／利用者が迷い込む）。
workers_dev = false

routes = [
  { pattern = "plamo-paint.com/*",     zone_name = "plamo-paint.com" },
  { pattern = "www.plamo-paint.com/*", zone_name = "plamo-paint.com" },
]

# ログの保持（Workers Logs）。
# これが無いと console.error の出力はどこにも残らず、障害が起きても「何が起きたか」を
# 後から調べる手段が一切ない（Cloudflareの画面でリアルタイムに見ている時だけ見える）。
# 有効にすると Cloudflare 側に一定期間ログが保存され、事後調査ができるようになる。
# head_sampling_rate = 1 は「全リクエストを記録する」の意味。個人規模のアクセス量なので
# 間引かず全部残す（無料枠に収まる範囲）。
# 静的ファイル（HTML/CSS/JS/画像）をこのWorkerに同梱して配信する。
# ★以前は GitHub Pages を配信元にしていたが、その公開URLを直接叩くと
#   このWorkerを通らないため、内部ファイルの遮断が効かなかった。同梱すれば入口が1つになる。
# directory は scripts/build_public.mjs が組み立てる public/。
#   ★「配らないものを除外する」ではなく「配るものだけを集める」方式にしている。
#     このリポジトリの手元には backups/storage/ に利用者の写真40MBがあり（Git管理外）、
#     除外方式だと1行書き忘れた瞬間に他人の写真が公開される。
#     集める方式なら、書き忘れて起きるのは「配信漏れ（すぐ気づく）」であって
#     「流出（気づかない）」ではない。
#   ※public/ は生成物なのでGit管理しない。deploy前に [build] が自動で作り直す。
# run_worker_first … Workerを先に通すパスを限定する。
#   ★以前は true（全部通す）にしていたため、画像・JS・faviconまで全部がWorkerの呼び出しになり、
#     無料枠10万回/日を1ページ表示あたり約10回ずつ消費していた（＝1日1万表示で上限）。
#     上限に達しても静的配信へ切り替わらず、サイト全体が429で止まる作りだった。
#     下に挙げた経路だけがWorkerの仕事（レシピのSSR・sitemap・robots・死活監視）で、
#     残りはCloudflareが直接配るため枠を消費しない。
#   ※内部ファイルはそもそも public/ に入れていないため、Workerを通らなくても配信されない。
#   ※セキュリティヘッダーは public/_headers で補う（scripts/build_public.mjs が生成）。
# html_handling = "none" … "/index.html" を "/" に転送したりしない。
#   worker.js 側で "/" → "/index.html" の対応付けを既にしているので、二重にやると事故る。
[build]
command = "node ../scripts/build_public.mjs"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = [
  # 動的な処理（レシピのSSR・sitemap・robots・死活監視）
  "/r/*", "/sitemap.xml", "/robots.txt", "/healthz", "/legacy", "/legacy.html",
  # ★人が直接開く「ページ」は必ずWorkerを通す。
  #   ここを外すと http:// で開いたときに https へ転送されず、平文のまま中身が返る。
  #   平文だと途中で書き換えられ、偽のログイン欄を差し込まれる恐れがある。
  #   （2026-08-01に一度これで穴を開けてしまい、実測して戻した）
  #   画像・JS・フォントはページがhttpsなら必ずhttpsで読まれるので、通さなくてよい。
  "/", "/index.html", "/help.html", "/privacy.html", "/terms.html",
  "/course.html", "/goodbye.html", "/diagnostics.html",
]
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1

# 公開して問題ない値（anon publishable key も含む）
[vars]
# 配信元。GitHub Pages を使う（raw.githubusercontent.com はCDN用途を想定しておらず、
# アクセス集中時に403/429を返して全ページが503になる。Pagesは100GB/月の帯域枠がある）
# ORIGIN は 2026-07-28 に不要になった（静的ファイルはWorkerに同梱＝[assets]）。
# 消さずに残しているのは、万一この変更を戻すときの復旧先として使うため。
# ※worker.js はもうこの値を読んでいない。
ORIGIN            = "https://shayan795.github.io/paint-log-v2"
SITE              = "https://plamo-paint.com"
SUPABASE_URL      = "https://zlkbaojclitlxshpxwpr.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_ZMaz3JjPfU0q_pq7Y9QwSQ_QimbhfgX"
